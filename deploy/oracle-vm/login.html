<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Login · Escala Médica — Hospital Cruzeiro do Sul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-header: #0044c4;
      --bg-body: #041538;
      --bg-card: #082152;
      --bg-card-inner: #061a42;
      --border-card: #1c3f82;
      --border-subtle: #16336b;
      --accent-orange: #f37021;
      --accent-yellow: #fdb913;
      --text-primary: #ffffff;
      --text-secondary: #c5d4ee;
      --text-muted: #7d9fdf;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --danger-border: rgba(248, 113, 113, 0.55);
      --danger-text: #fecaca;
      --font-sans: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      background-color: var(--bg-header);
      min-height: 58px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 3px solid transparent;
      border-image: linear-gradient(90deg, var(--accent-orange), var(--accent-yellow)) 1;
    }

    .header-divider {
      width: 1px;
      height: 30px;
      background: rgba(255, 255, 255, 0.25);
    }

    .header-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-sub {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 2px;
    }

    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 3px 3px 18px 3px;
      padding: 26px 24px;
    }

    .login-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .login-card h1 {
      margin: 6px 0 8px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .login-desc {
      margin: 0 0 20px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .input-control {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      background: var(--bg-card-inner);
      color: var(--text-primary);
      border: 1px solid var(--border-card);
      border-radius: 2px 2px 10px 2px;
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
    }

    .input-control:focus {
      border-color: var(--accent-orange);
    }

    .error-box {
      display: none;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      border-radius: 2px 2px 10px 2px;
      padding: 10px 12px;
      font-size: 12.5px;
      margin-bottom: 14px;
    }

    .error-box.is-visible { display: block; }

    .btn-submit {
      width: 100%;
      height: 42px;
      margin-top: 4px;
      background: var(--accent-orange);
      color: #ffffff;
      border: 1px solid var(--accent-orange);
      border-radius: 2px 2px 10px 2px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-submit:hover { filter: brightness(1.08); }
    .btn-submit:disabled { opacity: 0.65; cursor: wait; }

    .login-note {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    @media (max-width: 520px) {
      .header-divider { display: none; }
      .top-header { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 16px; }
      .login-card { padding: 20px 18px; }
    }
  </style>
</head>

    <div class="header-divider"></div>
    <div>
      <div class="header-title">Hospital Cruzeiro do Sul — Sistema de Plantões</div>
      <div class="header-sub">Acesso restrito</div>
    </div>
  </header>

  <main class="auth-main">
    <section class="login-card">
      <div class="login-eyebrow">SISTEMA DE PLANTÕES</div>
      <h1>Hospital Cruzeiro do Sul</h1>
      <p class="login-desc">
        Tela de login para o sistema de plantões do Hospital Cruzeiro do Sul.
      </p>

      <div id="errorBox" class="error-box" role="alert"></div>

      <form id="loginForm">
        <div class="field-group">
          <label class="field-label" for="username">Usuário</label>
          <input class="input-control" id="username" name="username" type="text" autocomplete="username" required autofocus />
        </div>
        <div class="field-group">
          <label class="field-label" for="password">Senha</label>
          <input class="input-control" id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn-submit" id="submitBtn" type="submit">Entrar</button>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const form = document.getElementById("loginForm");
      const errBox = document.getElementById("errorBox");
      const btn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.classList.remove("is-visible");
        btn.disabled = true;
        btn.textContent = "Verificando...";

        try {
          const res = await fetch("/_auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value.trim(),
              password: document.getElementById("password").value
            })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            errBox.textContent = data.error || "Não foi possível entrar.";
            errBox.classList.add("is-visible");
            btn.disabled = false;
            btn.textContent = "Entrar";
            return;
          }
          window.location.href = data.redirect || "/";
        } catch (err) {
          errBox.textContent = "Erro de conexão com o servidor.";
          errBox.classList.add("is-visible");
          btn.disabled = false;
          btn.textContent = "Entrar";
        }
      });
    })();
  </script>
